<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Nave Mouse</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#000; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const FRICTION = 0.95;
const ACCEL = 0.45;
const MAX_SPEED = 12;
const BOUNDS_MODE = 'bounce';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const bg = new Image();
bg.src = "backround.png";

const shipImg = new Image();
shipImg.src = "nave.png";

const ship = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  vx: 0,
  vy: 0,
  angle: 0,
  drawH: 64,
  size: 120
};

const mouse = { x: canvas.width/2, y: canvas.height/2 };

addEventListener("mousemove", e=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function update(){
  const dx = mouse.x - ship.x;
  const dy = mouse.y - ship.y;
  const dist = Math.hypot(dx, dy) || 1;

  ship.vx += (dx / dist) * ACCEL;
  ship.vy += (dy / dist) * ACCEL;

  const speed = Math.hypot(ship.vx, ship.vy);
  if(speed > MAX_SPEED){
    ship.vx = (ship.vx / speed) * MAX_SPEED;
    ship.vy = (ship.vy / speed) * MAX_SPEED;
  }

  ship.vx *= FRICTION;
  ship.vy *= FRICTION;

  ship.x += ship.vx;
  ship.y += ship.vy;

  ship.angle = Math.atan2(ship.vy, ship.vx);

  if(BOUNDS_MODE === "bounce"){
    if(ship.x < 0){ ship.x = 0; ship.vx = Math.abs(ship.vx); }
    if(ship.x > canvas.width){ ship.x = canvas.width; ship.vx = -Math.abs(ship.vx); }
    if(ship.y < 0){ ship.y = 0; ship.vy = Math.abs(ship.vy); }
    if(ship.y > canvas.height){ ship.y = canvas.height; ship.vy = -Math.abs(ship.vy); }
  }
  else if(BOUNDS_MODE === "clamp"){
    ship.x = Math.max(0, Math.min(canvas.width, ship.x));
    ship.y = Math.max(0, Math.min(canvas.height, ship.y));
  }
  else if(BOUNDS_MODE === "wrap"){
    if(ship.x < -50) ship.x = canvas.width + 50;
    if(ship.x > canvas.width + 50) ship.x = -50;
    if(ship.y < -50) ship.y = canvas.height + 50;
    if(ship.y > canvas.height + 50) ship.y = -50;
  }
}

function render(){
  if(bg.complete && bg.naturalWidth){
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle + Math.PI/2);

  if(shipImg.complete && shipImg.naturalWidth){
    const scale = ship.size / shipImg.height;
    const w = shipImg.width * scale;
    const h = shipImg.height * scale;
    ctx.drawImage(shipImg, -w/2, -h/2, w, h);
  } else {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(12, 12);
    ctx.lineTo(-12, 12);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
